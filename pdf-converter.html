<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载校园地图 PDF | 广海新生生存指南</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:#f4fbfd;color:#173042;display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;
  }
  .card{
    background:#fff;border-radius:24px;padding:36px 28px;max-width:420px;width:100%;
    box-shadow:0 14px 40px rgba(19,103,137,.12);border:1px solid #d9edf3;
  }
  h3{margin:0 0 12px;color:#064d70;font-size:22px}
  p{color:#66808f;font-size:15px;margin:0 0 24px;line-height:1.7}
  .btn{
    display:inline-block;padding:12px 24px;border-radius:14px;text-decoration:none;font-weight:700;
    background:linear-gradient(135deg,#0b6f9c,#149cc8);color:#fff;box-shadow:0 10px 28px rgba(19,103,137,.2);
  }
  .btn:hover{transform:translateY(-2px)}
  .home{
    display:block;margin-top:18px;color:#0b6f9c;text-decoration:none;font-size:14px;
  }
  .home:hover{text-decoration:underline}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="card">
    <h3>🏫 校园地图 PDF</h3>
    <p>正在把地图图片转换成 PDF 文件，请稍等片刻。</p>
    <a class="btn" href="index.html">返回首页</a>
    <a class="home" href="index.html#map">← 回到地图页面</a>
  </div>

<script>
window.onload = function() {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const w = img.width;
    const h = img.height;
    const orientation = w > h ? 'l' : 'p';
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: orientation,
      unit: 'px',
      format: [w, h],
      hotfixes: ['px_scaling']
    });
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
    pdf.save('campus-map.pdf');
    document.querySelector('p').textContent = 'PDF 已经下载好啦！如果没有自动下载，可以点击上方按钮返回首页。';
  };
  img.onerror = function() {
    document.querySelector('p').textContent = '地图图片加载失败，请检查 campus-map.jpg 是否存在。';
  };
  img.src = 'campus-map.jpg';
};
</script>
</body>
</html>
